name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/db-console

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -W error::ResourceWarning -m unittest -v

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: db-console:smoke

      - name: Smoke test the container
        run: |
          mkdir -p creds backups
          printf 'secretpw\n' > creds/app_password
          printf 'rootpw\n' > creds/root_password
          sudo chown -R 999:999 creds backups
          docker run -d --name smoke -p 8080:8080 \
            -v "$PWD/creds:/store/credentials:ro" -v "$PWD/backups:/store/backups:ro" \
            -e ENGINE=mongodb -e WORKLOAD=demo -e HOST=demo.ns.svc.cluster.local -e PORT=27017 \
            -e DATABASE=app -e APP_USER=app -e ADMIN_USER=root -e BASE_PATH=/ns/mongodb/demo/ \
            --read-only db-console:smoke
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/ns/mongodb/demo/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/ns/mongodb/demo/ | grep -q "mongodb://app:secretpw@demo.ns.svc.cluster.local:27017/app"
          test "$(docker inspect -f '{{.Config.User}}' db-console:smoke)" = "999:999"
          docker logs smoke
          docker rm -f smoke

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable={{is_default_branch}}

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
